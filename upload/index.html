<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#efe9d8">
<title>Post — HALZZ WALL</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="topbar" id="topbar"></header>

<main class="container">
  <div class="slip" style="width:100%; max-width:480px; margin:20px auto; box-shadow:6px 6px 0 rgba(31,28,20,0.18)">
    <div class="stamp">L</div>
    <div class="slip-head"><span>NEW SUBMISSION</span></div>
    <div style="padding:22px 20px">
      <h2 class="stamp-font" style="font-size:19px; margin-bottom:6px;">File your L</h2>
      <p style="font-size:13px; color:var(--ink-dim); margin-bottom:20px;">Short clips only. Under 500MB, 3 minutes max.</p>

      <form id="uploadForm">
        <div class="field">
          <label for="videoFile">Video file</label>
          <input id="videoFile" type="file" accept="video/*" required />
        </div>
        <div class="field">
          <label for="caption">Caption (optional)</label>
          <textarea id="caption" rows="3" maxlength="300" placeholder="What happened here..."></textarea>
        </div>

        <div id="uploadProgressWrap" style="display:none; margin-bottom:14px;">
          <div style="height:8px; background:var(--paper-dim); border:1.5px solid var(--ink); border-radius:100px; overflow:hidden;">
            <div id="uploadProgressBar" style="height:100%; width:0%; background:var(--stamp-red); transition:width .2s ease;"></div>
          </div>
        </div>

        <button id="uploadSubmit" type="submit" class="btn btn-stamp" style="width:100%; justify-content:center;">
          Submit
        </button>
        <p id="uploadStatus" style="margin-top:12px; font-size:12px; color:var(--ink-dim); min-height:1.4em;"></p>
      </form>
    </div>
  </div>
</main>

<nav class="bottomnav" id="bottomnav"></nav>

<script type="module">
  import { initAuth, getUser, openAuthModal } from "/js/auth.js";
  import { mountNav } from "/js/nav.js";
  import { initUpload } from "./upload.js";

  await initAuth();
  mountNav("upload");
  initUpload();

  if (!getUser()) openAuthModal("login");
</script>

</body>
</html>
