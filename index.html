<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const stage = document.getElementById('stage');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const touchDevice = matchMedia('(pointer:coarse)').matches;
const isMobile = touchDevice || innerWidth < 720;

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.75 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0418);
scene.fog = new THREE.FogExp2(0x0d0524, 0.012);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 400);
function frameForViewport() {
  const a = innerWidth / innerHeight;
  camera.aspect = a;
  camera.fov = a < 0.75 ? 60 : 50;
  camera.updateProjectionMatrix();
}
frameForViewport();

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.65, 0.6, 0.35);
composer.addPass(bloom);
composer.addPass(new OutputPass());

scene.add(new THREE.HemisphereLight(0x4a3388, 0x040112, 0.6));
const key = new THREE.PointLight(0xc084fc, 55, 60, 1.7); key.position.set(18, 10, 14); scene.add(key);
const rim = new THREE.PointLight(0x7c3aed, 40, 60, 1.7); rim.position.set(-14, -6, 10); scene.add(rim);

/* ---------- starfield ---------- */
{
  const N = 1400;
  const pos = new Float32Array(N * 3), phase = new Float32Array(N), sz = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const v = new THREE.Vector3().randomDirection().multiplyScalar(60 + Math.random() * 120);
    pos.set([v.x, v.y, v.z], i * 3);
    phase[i] = Math.random() * Math.PI * 2;
    sz[i] = 0.5 + Math.random() * 1.6;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('phase', new THREE.BufferAttribute(phase, 1));
  g.setAttribute('sz', new THREE.BufferAttribute(sz, 1));
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uT: { value: 0 } },
    vertexShader: `
      attribute float phase; attribute float sz; uniform float uT; varying float vA;
      void main(){
        vA = .35 + .65 * (0.5 + 0.5 * sin(uT * 1.2 + phase));
        vec3 p = position;
        p += vec3(
          sin(uT * .045 + phase) * 1.1,
          cos(uT * .038 + phase * 1.3) * 1.1,
          sin(uT * .03 + phase * .7) * 1.1
        );
        vec4 mv = modelViewMatrix * vec4(p,1.);
        gl_PointSize = sz * 2.2 * (200. / -mv.z);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying float vA;
      void main(){
        float d = length(gl_PointCoord - .5);
        float a = smoothstep(.5, .05, d) * vA;
        gl_FragColor = vec4(.85, .78, 1., a);
      }`
  });
  const stars = new THREE.Points(g, m);
  scene.add(stars);
  scene.userData.starMat = m;
  scene.userData.starMesh = stars;
}

/* ---------- shooting stars ---------- */
const SHOOTING_COUNT = isMobile ? 5 : 8;
const shootingStars = [];
{
  const trailLen = 22;
  for (let i = 0; i < SHOOTING_COUNT; i++) {
    const positions = new Float32Array(trailLen * 3);
    const alphas = new Float32Array(trailLen);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('aAlpha', new THREE.BufferAttribute(alphas, 1));
    const mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      vertexShader: `
        attribute float aAlpha; varying float vA;
        void main(){
          vA = aAlpha;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.);
        }`,
      fragmentShader: `
        varying float vA;
        void main(){
          gl_FragColor = vec4(0.9, 0.92, 1.0, vA);
        }`
    });
    const line = new THREE.Line(geo, mat);
    line.frustumCulled = false;
    line.visible = false;
    scene.add(line);
    shootingStars.push({
      line, positions, alphas,
      active: false,
      t: 0, dur: 1,
      start: new THREE.Vector3(),
      end: new THREE.Vector3(),
      nextAt: performance.now() / 1000 + Math.random() * 1.2
    });
  }
}
function launchShootingStar(s) {
  const R = 70;
  const originSide = (Math.random() < 0.5 ? -1 : 1);
  const startX = originSide * (R * 0.9 + Math.random() * 20);
  const startY = R * (0.15 + Math.random() * 0.55) * (Math.random() * 0.6 + 0.5);
  const startZ = -R * 0.3 - Math.random() * 40;
  s.start.set(startX, startY, startZ);
  const travel = 26 + Math.random() * 18;
  const dir = new THREE.Vector3(-originSide * (0.75 + Math.random() * 0.3), -(0.35 + Math.random() * 0.3), (Math.random() - 0.5) * 0.3).normalize();
  s.end.copy(s.start).addScaledVector(dir, travel);
  s.dur = 0.75 + Math.random() * 0.5;
  s.t = 0;
  s.active = true;
  s.line.visible = true;
}
function updateShootingStars(dt, time) {
  const now = time;
  for (const s of shootingStars) {
    if (!s.active) {
      if (now >= s.nextAt) launchShootingStar(s);
      continue;
    }
    s.t += dt / s.dur;
    if (s.t >= 1) {
      s.active = false;
      s.line.visible = false;
      s.nextAt = now + 0.6 + Math.random() * 2;
      continue;
    }
    const headT = s.t;
    const trailLen = s.positions.length / 3;
    for (let i = 0; i < trailLen; i++) {
      const back = (i / (trailLen - 1)) * 0.14;
      const pt = Math.max(0, headT - back);
      const p = new THREE.Vector3().lerpVectors(s.start, s.end, pt);
      s.positions[i * 3] = p.x;
      s.positions[i * 3 + 1] = p.y;
      s.positions[i * 3 + 2] = p.z;
      const fadeIn = Math.min(1, s.t * 6);
      const fadeOut = 1 - Math.max(0, (s.t - 0.75) / 0.25);
      s.alphas[i] = (i / (trailLen - 1)) * fadeIn * Math.min(fadeOut, 1);
    }
    s.line.geometry.attributes.position.needsUpdate = true;
    s.line.geometry.attributes.aAlpha.needsUpdate = true;
  }
}

/* ---------- drifting dust motes ---------- */
const MOTE_COUNT = isMobile ? 60 : 120;
let moteMat;
{
  const pos = new Float32Array(MOTE_COUNT * 3), seed = new Float32Array(MOTE_COUNT), hue = new Float32Array(MOTE_COUNT);
  for (let i = 0; i < MOTE_COUNT; i++) {
    pos[i * 3] = (Math.random() - 0.5) * 34;
    pos[i * 3 + 1] = (Math.random() - 0.5) * 22;
    pos[i * 3 + 2] = (Math.random() - 0.5) * 20 + 4;
    seed[i] = Math.random() * 100;
    hue[i] = Math.random();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('seed', new THREE.BufferAttribute(seed, 1));
  g.setAttribute('hue', new THREE.BufferAttribute(hue, 1));
  moteMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uT: { value: 0 } },
    vertexShader: `
      attribute float seed; attribute float hue; uniform float uT;
      varying float vA; varying float vH;
      void main(){
        vec3 p = position;
        p.x += sin(uT * .12 + seed) * 1.8 + sin(uT * .05 + seed * 2.) * 2.2;
        p.y += cos(uT * .1 + seed * 1.3) * 1.3 + sin(uT * .04 + seed) * 1.6;
        p.z += sin(uT * .08 + seed * .7) * 1.2;
        vH = hue;
        vA = .2 + .8 * pow(.5 + .5 * sin(uT * (0.8 + fract(seed) * 1.2) + seed * 6.), 3.0);
        vec4 mv = modelViewMatrix * vec4(p, 1.);
        gl_PointSize = (2.4 + fract(seed * 3.1) * 2.6) * (55. / -mv.z);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying float vA; varying float vH;
      void main(){
        float d = length(gl_PointCoord - .5);
        float core = smoothstep(.18, .0, d);
        float halo = smoothstep(.5, .05, d) * .35;
        vec3 cA = vec3(.75, .55, 1.);
        vec3 cB = vec3(1., .6, .92);
        vec3 col = mix(cA, cB, vH);
        gl_FragColor = vec4(col, (core + halo) * vA);
      }`
  });
  scene.add(new THREE.Points(g, moteMat));
}

/* ================= (planet, moons, background planets removed — stars only) ================= */
const world = new THREE.Group();
scene.add(world);

/* ---------- camera orbit control (drag) ---------- */
let camDist = 22, camTheta = 0.35, camPhi = 1.25;
let targetDist = camDist, targetTheta = camTheta, targetPhi = camPhi;
let dragging = false, lastX = 0, lastY = 0;
const cursorEl = document.getElementById('cursor');
function clampPhi(p){ return Math.max(0.35, Math.min(Math.PI - 0.35, p)); }

addEventListener('pointerdown', e => {
  if (e.target.closest('a')) return;
  dragging = true; lastX = e.clientX; lastY = e.clientY;
});
addEventListener('pointerup', () => dragging = false);
addEventListener('pointercancel', () => dragging = false);
addEventListener('pointermove', e => {
  cursorEl.style.left = e.clientX + 'px';
  cursorEl.style.top = e.clientY + 'px';
  if (dragging) {
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    targetTheta -= dx * 0.0045;
    targetPhi = clampPhi(targetPhi - dy * 0.0045);
  }
});

addEventListener('resize', () => {
  frameForViewport();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;

  if (!dragging && !reduceMotion) {
    targetTheta += dt * 0.035;
    targetPhi = clampPhi(1.25 + Math.sin(time * 0.18) * 0.08);
  }

  camDist += (targetDist - camDist) * Math.min(1, dt * 3);
  camTheta += (targetTheta - camTheta) * Math.min(1, dt * 5);
  camPhi += (targetPhi - camPhi) * Math.min(1, dt * 5);

  camera.position.set(
    camDist * Math.sin(camPhi) * Math.sin(camTheta),
    camDist * Math.cos(camPhi),
    camDist * Math.sin(camPhi) * Math.cos(camTheta)
  );
  camera.lookAt(0, 0.2, 0);

  scene.userData.starMat.uniforms.uT.value = time;
  scene.userData.starMesh.rotation.y = time * 0.006;
  scene.userData.starMesh.rotation.x = time * 0.003;
  moteMat.uniforms.uT.value = time;
  updateShootingStars(dt, time);

  bloom.strength = 0.65 + Math.sin(time * 0.6) * 0.05;

  composer.render();
}
animate();
</script>

<script>
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'F12') { e.preventDefault(); return; }
    if (e.ctrlKey && e.shiftKey && (k === 'I' || k === 'i' || k === 'J' || k === 'j' || k === 'C' || k === 'c')) { e.preventDefault(); return; }
    if (e.metaKey && e.altKey && (k === 'I' || k === 'i' || k === 'J' || k === 'j')) { e.preventDefault(); return; }
    if (e.ctrlKey && (k === 'U' || k === 'u')) { e.preventDefault(); return; }
  });
</script>
