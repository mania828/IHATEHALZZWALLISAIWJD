<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#efe9d8">
<title>Profile — HALZZ WALL</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="topbar" id="topbar"></header>

<main class="container" id="profileMain" style="display:none">
  <div style="text-align:center; margin-bottom:26px;">
    <label class="avatar-upload" for="avatarInput">
      <span id="avatarPreview"></span>
      <span class="avatar-edit-hint">Edit</span>
      <input id="avatarInput" type="file" accept="image/*" />
    </label>
    <div id="avatarStatus" style="font-size:11px; color:var(--ink-dim); min-height:1.4em; margin-bottom:6px;"></div>

    <h1 id="profileUsername" class="stamp-font" style="font-size:24px;"></h1>
    <p id="profileBio" style="font-size:13px; color:var(--ink-dim); margin-top:6px; max-width:320px; margin-left:auto; margin-right:auto;"></p>
  </div>

  <details style="margin-bottom:26px;">
    <summary style="cursor:pointer; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-dim);">Edit profile</summary>
    <form id="editProfileForm" style="margin-top:14px;">
      <div class="field">
        <label for="displayNameInput">Display name</label>
        <input id="displayNameInput" type="text" maxlength="40" />
      </div>
      <div class="field">
        <label for="bioInput">Bio</label>
        <textarea id="bioInput" rows="3" maxlength="200"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Save</button>
      <span id="editStatus" style="margin-left:10px; font-size:12px; color:var(--ink-dim);"></span>
    </form>
  </details>

  <h2 class="stamp-font" style="font-size:15px; margin-bottom:12px;">Your submissions</h2>
  <div id="profileGrid" style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px;"></div>
</main>

<div id="signedOutState" class="center-screen">
  <div class="empty-state">
    <span class="stamp-font">NOT SIGNED IN</span>
    <p>Sign in to see your profile.</p>
  </div>
</div>

<nav class="bottomnav" id="bottomnav"></nav>

<script type="module">
  import { initAuth, getUser, openAuthModal, onAuthChange } from "/js/auth.js";
  import { mountNav } from "/js/nav.js";
  import { initProfile } from "./profile.js";

  await initAuth();
  mountNav("profile");

  async function render() {
    if (getUser()) {
      document.getElementById("profileMain").style.display = "block";
      document.getElementById("signedOutState").style.display = "none";
      await initProfile();
    } else {
      document.getElementById("profileMain").style.display = "none";
      document.getElementById("signedOutState").style.display = "flex";
    }
  }

  onAuthChange(render);
  await render();
</script>

</body>
</html>
