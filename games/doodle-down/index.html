<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0418">
<title>Games — HALZZ WALL</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Fraunces:ital@1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0418; --ink:#f0eaff; --dim:#9d8fc9; --violet:#a78bfa;
    --field:#2e8b3d; --field-dark:#267533;
  }
  *{margin:0;padding:0;box-sizing:border-box;
    user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;
    -webkit-touch-callout:none;
  }
  html,body{height:100%;background:var(--bg);overflow:hidden}
  body{
    color:var(--ink); font-family:'Sora',sans-serif;
    display:flex; flex-direction:column; align-items:center;
    background-image:radial-gradient(ellipse 70% 50% at 50% 0%, rgba(139,92,246,0.18), transparent 60%);
  }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }

  .top{
    width:100%; max-width:520px; display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px 8px;
  }
  .back{ font-size:12.5px; color:var(--dim); }
  .back:hover{ color:var(--ink); }
  .title{ font-family:'Fraunces',serif; font-style:italic; font-size:14px; color:var(--violet); }

  .hud{
    width:100%; max-width:520px; display:flex; justify-content:space-between;
    padding:4px 18px 10px; font-family:'Sora',sans-serif; font-size:13px; font-weight:700;
  }
  .hud .lbl{ color:var(--dim); font-weight:500; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; }
  .hud .val{ color:var(--ink); font-size:17px; }
  .misses{ display:flex; gap:5px; align-items:center; }
  .miss-dot{ width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3); }
  .miss-dot.used{ background:#ff5959; border-color:#ff5959; }

  #fieldWrap{
    position:relative; width:100%; max-width:520px; flex:1; min-height:0;
    display:flex; align-items:center; justify-content:center; padding:0 10px 14px;
  }
  #field{
    width:100%; max-height:100%; aspect-ratio:9/13;
    border-radius:16px; box-shadow:0 20px 50px -20px rgba(0,0,0,.6);
    display:block; touch-action:manipulation;
  }

  #startScreen, #overScreen{
    position:fixed; inset:0; z-index:20; background:rgba(10,4,24,.88);
    backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  #overScreen{ display:none; }
  .card{
    max-width:340px; width:100%; text-align:center;
    background:linear-gradient(165deg,rgba(20,16,52,.7),rgba(8,5,26,.8));
    border:1px solid rgba(190,150,255,.2); border-radius:20px; padding:32px 26px;
  }
  .card h1{
    font-family:'Sora',sans-serif; font-weight:800; font-size:26px; letter-spacing:-0.01em;
    background:linear-gradient(160deg,#f6f0ff 20%,#cfaaff 55%,#8b5cf6 95%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-bottom:10px;
  }
  .card p{ font-size:13.5px; color:var(--dim); line-height:1.6; margin-bottom:22px; }
  .card .bigstat{ font-family:'Fraunces',serif; font-style:italic; font-size:15px; color:var(--ink); margin-bottom:4px; }
  .playbtn{
    display:inline-flex; align-items:center; gap:8px; padding:14px 30px; border-radius:100px;
    background:linear-gradient(160deg,#c084fc,#7c3aed); border:none; color:#0a0418;
    font-weight:700; font-size:14px; box-shadow:0 10px 30px -8px rgba(160,110,255,.6);
  }

  #flash{
    position:fixed; top:18%; left:50%; transform:translate(-50%,-50%) scale(0.8);
    z-index:15; pointer-events:none; opacity:0;
    font-family:'Sora',sans-serif; font-weight:800; font-size:34px; letter-spacing:-0.01em;
    text-shadow:0 6px 24px rgba(0,0,0,.5);
  }
  #flash.show{ animation:flashPop 0.9s ease forwards; }
  @keyframes flashPop{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(0.7); }
    15%{ opacity:1; transform:translate(-50%,-50%) scale(1.08); }
    30%{ transform:translate(-50%,-50%) scale(1); }
    80%{ opacity:1; }
    100%{ opacity:0; transform:translate(-50%,-60%) scale(1); }
  }
</style>
</head>
<body>

<div class="top">
  <a href="/games/" class="back">&larr; games</a>
  <span class="title">games</span>
</div>

<div class="hud">
  <div><div class="lbl">Yards</div><div class="val" id="hudYards">0</div></div>
  <div><div class="lbl">Streak</div><div class="val" id="hudStreak">0</div></div>
  <div>
    <div class="lbl">Misses</div>
    <div class="misses">
      <span class="miss-dot" id="miss0"></span>
      <span class="miss-dot" id="miss1"></span>
      <span class="miss-dot" id="miss2"></span>
    </div>
  </div>
</div>

<div id="fieldWrap">
  <canvas id="field"></canvas>
</div>

<div id="flash"></div>

<div id="startScreen">
  <div class="card">
    <h1>Doodle Down</h1>
    <p>Watch your receiver run the route. Tap the second he breaks open — too early or too late and the corner's got him covered.</p>
    <button class="playbtn" id="startBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#0a0418"><path d="M8 5v14l11-7z"/></svg>
      Play
    </button>
  </div>
</div>

<div id="overScreen">
  <div class="card">
    <h1>Drive over</h1>
    <div class="bigstat" id="finalYards">0 yards</div>
    <p id="finalMsg">Three incompletions. That's the drive.</p>
    <button class="playbtn" id="retryBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#0a0418"><path d="M8 5v14l11-7z"/></svg>
      Play again
    </button>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d');
  const fieldWrap = document.getElementById('fieldWrap');

  let W = 0, H = 0, DPR = Math.min(devicePixelRatio || 1, 2);

  function resize(){
    const rect = fieldWrap.getBoundingClientRect();
    let w = rect.width - 20, h = w * (13/9);
    if (h > rect.height - 14) { h = rect.height - 14; w = h * (9/13); }
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width = w * DPR;
    canvas.height = h * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    W = w; H = h;
  }
  resize();
  addEventListener('resize', resize);

  // ---------------- game state ----------------
  let yards = 0, streak = 0, misses = 0;
  let playing = false;
  let playActive = false;
  let ballInFlight = false;
  let flashLock = false;

  const hudYards = document.getElementById('hudYards');
  const hudStreak = document.getElementById('hudStreak');
  const missDots = [document.getElementById('miss0'), document.getElementById('miss1'), document.getElementById('miss2')];
  const flashEl = document.getElementById('flash');
  const startScreen = document.getElementById('startScreen');
  const overScreen = document.getElementById('overScreen');

  function updateHud(){
    hudYards.textContent = yards;
    hudStreak.textContent = streak;
    missDots.forEach((d,i) => d.classList.toggle('used', i < misses));
  }

  function showFlash(text, color){
    flashEl.textContent = text;
    flashEl.style.color = color;
    flashEl.classList.remove('show');
    void flashEl.offsetWidth;
    flashEl.classList.add('show');
  }

  // ---------------- route definitions (relative field coords, 0-1) ----------------
  const ROUTES = [
    { name: 'slant', yards: 6,  pts: [[0.28,0.82],[0.28,0.62],[0.55,0.42]] },
    { name: 'out',   yards: 9,  pts: [[0.25,0.85],[0.25,0.5],[0.05,0.38]] },
    { name: 'post',  yards: 22, pts: [[0.7,0.85],[0.7,0.45],[0.45,0.12]] },
    { name: 'go',    yards: 34, pts: [[0.75,0.85],[0.75,0.4],[0.75,0.06]] },
    { name: 'corner',yards: 18, pts: [[0.3,0.85],[0.3,0.5],[0.85,0.28]] },
  ];

  function bezierPoint(pts, t){
    // quadratic bezier through 3 control points
    const [p0,p1,p2] = pts;
    const x = (1-t)*(1-t)*p0[0] + 2*(1-t)*t*p1[0] + t*t*p2[0];
    const y = (1-t)*(1-t)*p0[1] + 2*(1-t)*t*p1[1] + t*t*p2[1];
    return [x, y];
  }

  let qbPos = [0.5, 0.92];
  let route = null;
  let routeStart = 0;
  let routeDur = 2200;      // ms
  let defenderLag = 380;    // ms behind receiver
  let ball = null;          // {fromX,fromY,toX,toY,start,dur,result}
  let difficultyLevel = 0;

  function newPlay(){
    playActive = true;
    ballInFlight = false;
    route = ROUTES[Math.floor(Math.random() * ROUTES.length)];
    routeStart = performance.now();
    routeDur = Math.max(1150, 1850 - difficultyLevel * 70);
    defenderLag = Math.max(120, 300 - difficultyLevel * 12);
  }

  function fieldPx(pt){
    return [pt[0] * W, pt[1] * H];
  }

  function getReceiverT(now){
    return Math.min(1, (now - routeStart) / routeDur);
  }
  function getDefenderT(now){
    return Math.min(1, Math.max(0, (now - routeStart - defenderLag) / routeDur));
  }

  function separationAt(now){
    const rT = getReceiverT(now);
    const dT = getDefenderT(now);
    const rP = bezierPoint(route.pts, rT);
    const dP = bezierPoint(route.pts, dT);
    const dx = (rP[0]-dP[0]) * W, dy = (rP[1]-dP[1]) * H;
    return Math.hypot(dx, dy);
  }

  function attemptThrow(clientX, clientY){
    if (!playing || !playActive || ballInFlight) return;
    const now = performance.now();
    const rT = getReceiverT(now);
    if (rT >= 1) return; // route already over, no throw

    const rect = canvas.getBoundingClientRect();
    const aimX = (clientX - rect.left);
    const aimY = (clientY - rect.top);

    const [qx, qy] = fieldPx(qbPos);

    ballInFlight = true;
    ball = {
      fromX: qx, fromY: qy, toX: aimX, toY: aimY,
      start: now, dur: 360,
      routeSnapshot: route
    };
  }

  function resolveThrow(){
    const now = performance.now();
    const rT = getReceiverT(now);
    const rPt = bezierPoint(route.pts, Math.min(1, rT));
    const [rx, ry] = fieldPx(rPt);

    const missDist = Math.hypot(ball.toX - rx, ball.toY - ry);
    const sep = separationAt(now);
    const catchRadius = Math.max(16, 30 - difficultyLevel * 0.8);

    let result;
    if (missDist > catchRadius){
      result = 'incomplete'; // thrown to the wrong spot entirely — bad aim
    } else if (sep > 55) {
      result = 'td-or-big';
    } else if (sep > 28) {
      result = 'short';
    } else {
      result = Math.random() < 0.45 ? 'intercepted' : 'incomplete';
    }

    playActive = false;
    ballInFlight = false;

    if (result === 'td-or-big'){
      const gained = ball.routeSnapshot.yards;
      yards += gained;
      streak += 1;
      difficultyLevel += 1;
      showFlash(gained >= 20 ? 'TOUCHDOWN!' : '+' + gained + ' YARDS', '#34d399');
      updateHud();
      setTimeout(() => { if (playing) newPlay(); }, 700);
    } else if (result === 'short'){
      const gained = Math.max(3, Math.round(ball.routeSnapshot.yards * 0.35));
      yards += gained;
      streak += 1;
      difficultyLevel += 0.5;
      showFlash('+' + gained + ' yards', '#c9a2ff');
      updateHud();
      setTimeout(() => { if (playing) newPlay(); }, 700);
    } else if (result === 'incomplete'){
      streak = 0;
      registerMiss(missDist > catchRadius ? 'OFF TARGET' : 'INCOMPLETE', '#ff9d5c');
    } else {
      streak = 0;
      registerMiss('INTERCEPTED', '#ff5959');
    }
  }

  function registerMiss(label, color){
    misses += 1;
    updateHud();
    showFlash(label, color);
    if (misses >= 3){
      setTimeout(endGame, 750);
    } else {
      setTimeout(() => { if (playing) newPlay(); }, 700);
    }
  }

  function endGame(){
    playing = false;
    playActive = false;
    document.getElementById('finalYards').textContent = yards + ' yards';
    const msgs = [
      "Three incompletions. That's the drive.",
      "Defense held. Nice run while it lasted.",
      "Picked off one too many times.",
    ];
    document.getElementById('finalMsg').textContent = msgs[Math.floor(Math.random()*msgs.length)];
    overScreen.style.display = 'flex';
  }

  function startGame(){
    yards = 0; streak = 0; misses = 0; difficultyLevel = 0;
    updateHud();
    startScreen.style.display = 'none';
    overScreen.style.display = 'none';
    playing = true;
    newPlay();
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);
  canvas.addEventListener('pointerdown', (e) => attemptThrow(e.clientX, e.clientY));

  // ---------------- doodle-style character drawing ----------------
  function drawPlayer(x, y, bodyColor, faceDir, scale, label){
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    // shadow
    ctx.beginPath();
    ctx.ellipse(0, 16, 13, 4, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fill();

    // legs
    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-4,8); ctx.lineTo(-6,16); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4,8); ctx.lineTo(6,16); ctx.stroke();

    // body
    ctx.beginPath();
    ctx.ellipse(0, 2, 11, 13, 0, 0, Math.PI*2);
    ctx.fillStyle = bodyColor;
    ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#171226'; ctx.stroke();

    // arms
    ctx.strokeStyle = bodyColor; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-9,0); ctx.lineTo(-15, faceDir*4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(9,0); ctx.lineTo(15, faceDir*-4+8); ctx.stroke();
    ctx.strokeStyle = '#171226'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-9,0); ctx.lineTo(-15, faceDir*4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(9,0); ctx.lineTo(15, faceDir*-4+8); ctx.stroke();

    // head
    ctx.beginPath();
    ctx.arc(0, -14, 8.5, 0, Math.PI*2);
    ctx.fillStyle = '#f0c48a';
    ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#171226'; ctx.stroke();

    // helmet
    ctx.beginPath();
    ctx.arc(0, -15.5, 8.8, Math.PI*0.95, Math.PI*2.05);
    ctx.fillStyle = bodyColor;
    ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#171226'; ctx.stroke();

    // eye
    ctx.beginPath();
    ctx.arc(faceDir*3, -14, 1.4, 0, Math.PI*2);
    ctx.fillStyle = '#171226';
    ctx.fill();

    ctx.restore();

    if (label){
      ctx.font = '700 9px Sora, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.textAlign = 'center';
      ctx.fillText(label, x, y + 34*scale);
    }
  }

  function drawField(now){
    ctx.clearRect(0,0,W,H);

    // grass
    const stripeCount = 10;
    for (let i=0;i<stripeCount;i++){
      ctx.fillStyle = i % 2 === 0 ? '#2e8b3d' : '#279236';
      ctx.fillRect(0, H*i/stripeCount, W, H/stripeCount + 1);
    }

    // yard lines
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 2;
    for (let i=1;i<10;i++){
      const y = H * i/10;
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    }
    // end zone
    ctx.fillStyle = 'rgba(124,58,237,0.35)';
    ctx.fillRect(0, 0, W, H*0.1);
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = '700 11px Sora, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('END ZONE', W/2, H*0.06);

    if (!playing) return;

    // QB
    const [qx, qy] = fieldPx(qbPos);
    drawPlayer(qx, qy, '#7c3aed', 1, 1.15, 'QB');

    if (playActive && route){
      const rT = getReceiverT(now);
      const dT = getDefenderT(now);
      const rPt = bezierPoint(route.pts, rT);
      const dPt = bezierPoint(route.pts, dT);
      const [rx, ry] = fieldPx(rPt);
      const [dx, dy] = fieldPx(dPt);

      const sep = separationAt(now);
      const openColor = sep > 55 ? '#34d399' : sep > 28 ? '#ffd166' : '#ff5959';

      // separation glow ring around receiver when open
      if (sep > 28){
        ctx.beginPath();
        ctx.arc(rx, ry, 20, 0, Math.PI*2);
        ctx.strokeStyle = openColor;
        ctx.globalAlpha = 0.5;
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      drawPlayer(dx, dy, '#e11d1d', -1, 1, '');
      drawPlayer(rx, ry, '#3ec6ff', 1, 1.05, '');
    }

    // ball in flight
    if (ballInFlight && ball){
      const t = Math.min(1, (now - ball.start) / ball.dur);
      const bx = ball.fromX + (ball.toX - ball.fromX) * t;
      const by = ball.fromY + (ball.toY - ball.fromY) * t - Math.sin(t*Math.PI) * 40;
      ctx.beginPath();
      ctx.ellipse(bx, by, 6, 4, 0.4, 0, Math.PI*2);
      ctx.fillStyle = '#8b5a2b';
      ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();

      if (t >= 1){
        resolveThrow();
      }
    }
  }

  function loop(){
    const now = performance.now();
    drawField(now);

    if (playing && playActive && !ballInFlight){
      const rT = getReceiverT(now);
      if (rT >= 1){
        // receiver ran out of route without a throw = incomplete
        playActive = false;
        streak = 0;
        registerMiss('TOO LATE', '#ff9d5c');
      }
    }

    requestAnimationFrame(loop);
  }
  loop();
})();
</script>

</body>
</html>
