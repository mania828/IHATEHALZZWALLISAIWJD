<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0418">
<title>Photo Wall — HALZZWALL</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Fraunces:ital@1&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0a0418; --ink:#f0eaff; --dim:#9d8fc9; --violet:#a78bfa; }
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
  html,body{height:100%;background:var(--bg);overflow:hidden}
  body{ color:var(--ink); font-family:'Sora',sans-serif; display:flex; flex-direction:column; align-items:center; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }

  .top{ width:100%; max-width:520px; display:flex; align-items:center; justify-content:space-between; padding:16px 18px 8px; }
  .back{ font-size:12.5px; color:var(--dim); } .back:hover{ color:var(--ink); }
  .title{ font-family:'Fraunces',serif; font-style:italic; font-size:14px; color:var(--violet); }

  .counter{ width:100%; max-width:520px; text-align:center; padding:4px 18px 14px; font-size:12.5px; color:var(--dim); }
  .counter b{ color:var(--ink); }

  #stageWrap{ position:relative; width:100%; max-width:480px; flex:1; min-height:0; padding:0 16px 20px; display:flex; align-items:center; justify-content:center; }

  #deck{ position:relative; width:100%; height:100%; max-height:640px; }

  .photo-card{
    position:absolute; inset:0; border-radius:20px; overflow:hidden;
    background:#000; border:1px solid rgba(190,150,255,.2);
    box-shadow:0 25px 60px -20px rgba(0,0,0,.6);
    display:flex; align-items:flex-end;
    touch-action:pan-y;
    transition:transform .35s cubic-bezier(.2,1,.3,1), opacity .35s ease;
  }
  .photo-card img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  }
  .photo-caption{
    position:relative; z-index:2; width:100%; padding:18px 20px;
    background:linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    font-size:13.5px; color:#fff;
  }

  .nav-btns{ display:flex; align-items:center; gap:22px; margin-top:16px; }
  .nav-btn{
    width:46px; height:46px; border-radius:50%; border:1px solid rgba(190,150,255,.25);
    background:rgba(20,16,52,.55); display:flex; align-items:center; justify-content:center;
    transition:transform .15s ease, border-color .15s ease;
  }
  .nav-btn:hover{ transform:translateY(-2px); border-color:rgba(196,162,255,.5); }
  .nav-btn svg{ width:18px; height:18px; fill:none; stroke:var(--ink); stroke-width:2; }

  .hint{ margin-top:10px; font-size:11px; letter-spacing:.06em; color:var(--dim); text-transform:uppercase; }

  #emptyState{
    display:none; text-align:center; max-width:300px; color:var(--dim); font-size:13.5px; line-height:1.6;
  }
  #emptyState.show{ display:block; }
</style>
</head>
<body>

<div class="top"><a href="/games/" class="back">&larr; games</a><span class="title">photo wall</span></div>
<div class="counter"><b id="curNum">1</b> / <span id="totalNum">1</span></div>

<div id="stageWrap">
  <div id="deck"></div>
  <div id="emptyState">No photos yet. Add some to the PHOTOS list in this page's code.</div>
</div>

<div class="nav-btns">
  <button class="nav-btn" id="prevBtn"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="nav-btn" id="nextBtn"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
</div>
<div class="hint">swipe, click the arrows, or use ← →</div>

<script>
(function(){
  // ==========================================================================
  // Photo list — add more here as you take/upload them. Each entry needs a
  // path to the image (relative to this page) and an optional caption.
  // ==========================================================================
  const PHOTOS = [
    { src: "photos/photo1.jpg", caption: "" },
    // { src: "photos/photo2.jpg", caption: "another one" },
  ];

  const deck = document.getElementById('deck');
  const curNum = document.getElementById('curNum');
  const totalNum = document.getElementById('totalNum');
  const emptyState = document.getElementById('emptyState');
  let index = 0;

  totalNum.textContent = PHOTOS.length;

  if (PHOTOS.length === 0){
    emptyState.classList.add('show');
    document.getElementById('prevBtn').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'none';
    return;
  }

  function render(){
    deck.innerHTML = '';
    PHOTOS.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'photo-card';
      const offset = i - index;
      if (offset === 0){
        card.style.transform = 'translateX(0) scale(1)';
        card.style.zIndex = 3;
        card.style.opacity = '1';
      } else if (offset === -1 || (index === 0 && i === PHOTOS.length-1)){
        card.style.transform = 'translateX(-14px) scale(0.94)';
        card.style.zIndex = 1;
        card.style.opacity = '0';
        card.style.pointerEvents = 'none';
      } else if (offset === 1 || (index === PHOTOS.length-1 && i === 0)){
        card.style.transform = 'translateX(14px) scale(0.94)';
        card.style.zIndex = 2;
        card.style.opacity = '0.001';
        card.style.pointerEvents = 'none';
      } else {
        card.style.transform = 'translateX(0) scale(0.9)';
        card.style.opacity = '0';
        card.style.zIndex = 0;
        card.style.pointerEvents = 'none';
      }
      card.innerHTML = `<img src="${p.src}" alt="" draggable="false" />` +
        (p.caption ? `<div class="photo-caption">${escapeHtml(p.caption)}</div>` : '');
      deck.appendChild(card);
    });
    curNum.textContent = index + 1;
  }

  function next(){ index = (index + 1) % PHOTOS.length; render(); }
  function prev(){ index = (index - 1 + PHOTOS.length) % PHOTOS.length; render(); }

  document.getElementById('nextBtn').addEventListener('click', next);
  document.getElementById('prevBtn').addEventListener('click', prev);
  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') prev();
  });

  let touchStartX = null;
  deck.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, {passive:true});
  deck.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 40){ dx < 0 ? next() : prev(); }
    touchStartX = null;
  }, {passive:true});

  function escapeHtml(s){
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  render();
})();
</script>

</body>
</html>
