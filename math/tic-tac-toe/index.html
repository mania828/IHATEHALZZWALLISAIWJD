<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0418">
<title>Three in a Row — HALZZWALL</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Fraunces:ital@1&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0a0418; --ink:#f0eaff; --dim:#9d8fc9; --violet:#a78bfa; }
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
  html,body{height:100%;background:var(--bg);overflow:hidden}
  body{ color:var(--ink); font-family:'Sora',sans-serif; display:flex; flex-direction:column; align-items:center; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }
  .top{ width:100%; max-width:900px; display:flex; align-items:center; justify-content:space-between; padding:16px 18px 8px; }
  .back{ font-size:12.5px; color:var(--dim); } .back:hover{ color:var(--ink); }
  .title{ font-family:'Fraunces',serif; font-style:italic; font-size:14px; color:var(--violet); }
  .status{ width:100%; max-width:900px; text-align:center; padding:8px 18px 16px; font-size:13.5px; color:var(--dim); }
  .status b{ color:var(--ink); }
  #boardWrap{ width:100%; max-width:900px; padding:0 18px 20px; flex:1; display:flex; align-items:center; justify-content:center; }
  #board{
    width:100%; max-width:420px; display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
  }
  .cell{
    aspect-ratio:1/1; background:rgba(20,16,52,.55); border:1px solid rgba(190,150,255,.2); border-radius:12px;
    display:flex; align-items:center; justify-content:center; font-size:38px; font-weight:800; cursor:pointer;
    transition:background .15s ease;
  }
  .cell:hover{ background:rgba(139,92,246,0.15); }
  .cell.x{ color:#3ec6ff; } .cell.o{ color:#ff5959; }
  .cell.win{ background:rgba(52,211,153,0.2); border-color:#34d399; }
  .scoreboard{ display:flex; gap:18px; margin-top:14px; font-size:12.5px; color:var(--dim); }
  .scoreboard b{ color:var(--ink); }
  .resetbtn{
    margin-top:16px; padding:10px 22px; border-radius:100px; border:1px solid rgba(190,150,255,.25);
    background:rgba(20,16,52,.5); color:var(--ink); font-size:12.5px; font-weight:600;
  }
</style>
</head>
<body>

<div class="top"><a href="/math/" class="back">&larr; games</a><span class="title">three in a row</span></div>
<div class="status" id="status">You're <b>X</b>. Your move.</div>
<div id="boardWrap">
  <div>
    <div id="board"></div>
    <div class="scoreboard">
      <span>You: <b id="scoreX">0</b></span>
      <span>CPU: <b id="scoreO">0</b></span>
      <span>Ties: <b id="scoreTie">0</b></span>
    </div>
    <div style="text-align:center"><button class="resetbtn" id="resetBtn">New round</button></div>
  </div>
</div>

<script>
(function(){
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  let cells, gameOver;
  let scores = { X:0, O:0, Tie:0 };

  const LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  function reset(){
    cells = Array(9).fill(null);
    gameOver = false;
    statusEl.innerHTML = "You're <b>X</b>. Your move.";
    render();
  }

  function render(){
    boardEl.innerHTML = '';
    const winLine = checkWinner(cells).line;
    cells.forEach((v,i) => {
      const el = document.createElement('div');
      el.className = 'cell' + (v==='X'?' x':'') + (v==='O'?' o':'') + (winLine && winLine.includes(i)?' win':'');
      el.textContent = v || '';
      el.addEventListener('click', () => playerMove(i));
      boardEl.appendChild(el);
    });
  }

  function checkWinner(b){
    for (const line of LINES){
      const [a,c,d] = line;
      if (b[a] && b[a]===b[c] && b[a]===b[d]) return { winner:b[a], line };
    }
    if (b.every(v=>v)) return { winner:'Tie', line:null };
    return { winner:null, line:null };
  }

  function playerMove(i){
    if (gameOver || cells[i]) return;
    cells[i] = 'X';
    render();
    const result = checkWinner(cells);
    if (result.winner){ finish(result); return; }
    statusEl.innerHTML = "CPU is thinking...";
    setTimeout(cpuMove, 400);
  }

  function cpuMove(){
    if (gameOver) return;
    const best = minimax(cells, 'O');
    cells[best.index] = 'O';
    render();
    const result = checkWinner(cells);
    if (result.winner){ finish(result); return; }
    statusEl.innerHTML = "You're <b>X</b>. Your move.";
  }

  function minimax(board, player){
    const result = checkWinner(board);
    if (result.winner === 'X') return { score: -10 };
    if (result.winner === 'O') return { score: 10 };
    if (result.winner === 'Tie') return { score: 0 };

    const moves = [];
    for (let i=0;i<9;i++){
      if (board[i]) continue;
      const newBoard = board.slice();
      newBoard[i] = player;
      const next = minimax(newBoard, player==='O'?'X':'O');
      moves.push({ index:i, score: next.score });
    }

    if (player === 'O'){
      return moves.reduce((best,m)=> m.score>best.score?m:best, {score:-Infinity});
    } else {
      return moves.reduce((best,m)=> m.score<best.score?m:best, {score:Infinity});
    }
  }

  function finish(result){
    gameOver = true;
    render();
    if (result.winner === 'Tie'){
      scores.Tie += 1;
      statusEl.textContent = "It's a tie.";
    } else if (result.winner === 'X'){
      scores.X += 1;
      statusEl.innerHTML = "<b>You win!</b>";
    } else {
      scores.O += 1;
      statusEl.innerHTML = "<b>CPU wins.</b>";
    }
    document.getElementById('scoreX').textContent = scores.X;
    document.getElementById('scoreO').textContent = scores.O;
    document.getElementById('scoreTie').textContent = scores.Tie;
  }

  document.getElementById('resetBtn').addEventListener('click', reset);
  reset();
})();
</script>
</body>
</html>
