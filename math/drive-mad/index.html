<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0418">
<script src="/math/settings.js"></script>
<title>Drive Mad — HALZZWALL</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Fraunces:ital@1&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0a0418; --bg-deep:#0a0418; --ink:#f0eaff; --dim:#9d8fc9; --violet:#a78bfa; --surface:rgba(20,16,52,.55); --border:rgba(190,150,255,.18); }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--bg);overflow:hidden}
  body{ color:var(--ink); font-family:'Sora',sans-serif; display:flex; flex-direction:column; align-items:center; }
  a{ color:inherit; text-decoration:none; }

  .top{ width:100%; max-width:1100px; display:flex; align-items:center; justify-content:space-between; padding:16px 18px 8px; }
  .back{ font-size:12.5px; color:var(--dim); } .back:hover{ color:var(--ink); }
  .title{ font-family:'Fraunces',serif; font-style:italic; font-size:14px; color:var(--violet); }
  .note{ font-size:10.5px; color:var(--dim); }

  #frameWrap{
    width:100%; max-width:1100px; flex:1; min-height:0; padding:0 14px 16px;
    display:flex; align-items:center; justify-content:center;
  }
  #frameInner{
    position:relative; width:100%; height:100%; border-radius:16px; overflow:hidden;
    border:1px solid var(--border); box-shadow:0 20px 50px -20px rgba(0,0,0,.6); background:#000;
  }
  iframe{
    position:absolute; inset:0; width:100%; height:100%; border:0;
  }
</style>
</head>
<body>

<div class="top">
  <a href="/math/" class="back">&larr; games</a>
  <span class="title">drive mad</span>
  <span class="note">hosted externally</span>
</div>

<div id="frameWrap">
  <div id="frameInner">
    <iframe
      id="gameframe"
      allow="autoplay; gamepad; accelerometer; gyroscope; keyboard-map *; focus-without-user-activation *; fullscreen"
      scrolling="no"
      title="Drive Mad"
      src="https://f9564e4e-ef25-4e4b-ba67-cb11a1576bbd.gdn.poki.com/68ae072b-bde4-4175-8300-0e3e02c5a10e/index.html?country=US&ccpaApplies=0&url_referrer=https%3A%2F%2Fpoki.com%2F&tag=pg-03e8da8e179b23f2cdbdff717f922d450d126082&site_id=3&iso_lang=en&poki_url=https%3A%2F%2Fpoki.com%2Fen%2Fg%2Fdrive-mad&hoist=yes&nonPersonalized=n&cloudsavegames=n&familyFriendly=n&device=desktop&categories=1%2C76%2C78%2C93%2C103%2C377%2C390%2C929%2C1139%2C1140%2C1185%2C1190%2C1193&special_condition=landing&game_id=f9564e4e-ef25-4e4b-ba67-cb11a1576bbd&game_version_id=68ae072b-bde4-4175-8300-0e3e02c5a10e&inspector=0&csp=1"
      loading="lazy">

  </div>
</div>

</body>
</html>
