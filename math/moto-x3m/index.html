<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Moto X3M — HALZZWALL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0418;}
  #game-frame{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    border:none;
    display:block;
    background:#000;
  }
  #back-btn{
    position:fixed;top:14px;left:14px;z-index:9999;
    display:flex;align-items:center;gap:6px;
    padding:8px 14px;
    background:rgba(10,4,24,.78);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(190,150,255,.22);
    border-radius:100px;
    color:#f0eaff;
    font-family:'Sora',sans-serif;font-size:12.5px;font-weight:600;
    text-decoration:none;
    transition:border-color .2s,background .2s,opacity .2s;
    cursor:pointer;
    opacity:0.85;
  }
  #back-btn:hover{border-color:rgba(196,162,255,.55);background:rgba(10,4,24,.95);opacity:1;}
  #back-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
</style>
</head>
<body>
<a id="back-btn" href="/math/">
  <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  Games
</a>
<iframe
  id="game-frame"
  src="https://moto-x3mgame.github.io/a8/moto-x3m"
  frameborder="0"
  border="0"
  allowfullscreen
  allow="fullscreen *; autoplay *; payment *"
  scrolling="no"
></iframe>
</body>
</html>
