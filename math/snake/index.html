<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0418">
<title>Slither — HALZZWALL</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Fraunces:ital@1&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0a0418; --ink:#f0eaff; --dim:#9d8fc9; --violet:#a78bfa; }
  *{margin:0;padding:0;box-sizing:border-box;
    user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;-webkit-touch-callout:none;
  }
  html,body{height:100%;background:var(--bg);overflow:hidden}
  body{ color:var(--ink); font-family:'Sora',sans-serif; display:flex; flex-direction:column; align-items:center; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }

  .top{ width:100%; max-width:900px; display:flex; align-items:center; justify-content:space-between; padding:16px 18px 8px; }
  .back{ font-size:12.5px; color:var(--dim); }
  .back:hover{ color:var(--ink); }
  .title{ font-family:'Fraunces',serif; font-style:italic; font-size:14px; color:var(--violet); }

  .hud{ width:100%; max-width:900px; display:flex; justify-content:space-between; padding:4px 18px 10px; }
  .hud .lbl{ color:var(--dim); font-weight:500; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; }
  .hud .val{ color:var(--ink); font-size:19px; font-weight:700; }

  #gameWrap{ position:relative; width:100%; max-width:900px; flex:1; min-height:0; padding:0 10px 14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; }
  #game{ width:100%; max-height:100%; aspect-ratio:1/1; border-radius:16px; box-shadow:0 20px 50px -20px rgba(0,0,0,.6); display:block; touch-action:none; }

  .dpad{ display:none; grid-template-columns:repeat(3,44px); grid-template-rows:repeat(3,44px); gap:6px; }
  .dpad.show{ display:grid; }
  .dpad button{
    background:rgba(20,16,52,.6); border:1px solid rgba(190,150,255,.2); border-radius:10px;
    color:var(--ink); display:flex; align-items:center; justify-content:center;
  }
  .dpad button svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; }
  .dpad .up{ grid-column:2; grid-row:1; }
  .dpad .left{ grid-column:1; grid-row:2; }
  .dpad .right{ grid-column:3; grid-row:2; }
  .dpad .down{ grid-column:2; grid-row:3; }

  #startScreen, #overScreen{
    position:fixed; inset:0; z-index:20; background:rgba(10,4,24,.88); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  #overScreen{ display:none; }
  .card{
    max-width:340px; width:100%; text-align:center;
    background:linear-gradient(165deg,rgba(20,16,52,.7),rgba(8,5,26,.8));
    border:1px solid rgba(190,150,255,.2); border-radius:20px; padding:32px 26px;
  }
  .card h1{
    font-weight:800; font-size:26px; letter-spacing:-0.01em;
    background:linear-gradient(160deg,#f6f0ff 20%,#cfaaff 55%,#8b5cf6 95%);
    -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:10px;
  }
  .card p{ font-size:13.5px; color:var(--dim); line-height:1.6; margin-bottom:22px; }
  .bigstat{ font-family:'Fraunces',serif; font-style:italic; font-size:15px; margin-bottom:4px; }
  .playbtn{
    display:inline-flex; align-items:center; gap:8px; padding:14px 30px; border-radius:100px;
    background:linear-gradient(160deg,#c084fc,#7c3aed); border:none; color:#0a0418; font-weight:700; font-size:14px;
    box-shadow:0 10px 30px -8px rgba(160,110,255,.6);
  }
</style>
</head>
<body>

<div class="top">
  <a href="/math/" class="back">&larr; games</a>
  <span class="title">slither</span>
</div>

<div class="hud">
  <div><div class="lbl">Score</div><div class="val" id="hudScore">0</div></div>
  <div><div class="lbl">Best</div><div class="val" id="hudBest">0</div></div>
</div>

<div id="gameWrap">
  <canvas id="game"></canvas>
  <div class="dpad" id="dpad">
    <button class="up" data-dir="up"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7-7 7 7"/></svg></button>
    <button class="left" data-dir="left"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></button>
    <button class="right" data-dir="right"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
    <button class="down" data-dir="down"><svg viewBox="0 0 24 24"><path d="M12 19V5M19 12l-7 7-7-7"/></svg></button>
  </div>
</div>

<div id="startScreen">
  <div class="card">
    <h1>Slither</h1>
    <p>Arrow keys or swipe to steer. Eat the dots, don't hit yourself or the wall.</p>
    <button class="playbtn" id="startBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#0a0418"><path d="M8 5v14l11-7z"/></svg>
      Play
    </button>
  </div>
</div>

<div id="overScreen">
  <div class="card">
    <h1>Game over</h1>
    <div class="bigstat" id="finalScore">0</div>
    <p>Give it another go.</p>
    <button class="playbtn" id="retryBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#0a0418"><path d="M8 5v14l11-7z"/></svg>
      Try again
    </button>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('gameWrap');
  const dpad = document.getElementById('dpad');
  let DPR = Math.min(devicePixelRatio||1, 2);

  const GRID = 18;
  let cell, W, H;

  function resize(){
    const rect = wrap.getBoundingClientRect();
    const size = Math.min(rect.width - 20, rect.height - (dpad.classList.contains('show') ? 160 : 20));
    canvas.style.width = size+'px'; canvas.style.height = size+'px';
    canvas.width = size*DPR; canvas.height = size*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    W = size; H = size;
    cell = W / GRID;
  }

  const touchDevice = matchMedia('(pointer:coarse)').matches;
  if (touchDevice) dpad.classList.add('show');
  resize();
  addEventListener('resize', resize);

  let snake, dir, nextDir, food, score, best, playing, tickMs, tickTimer;
  best = Number(localStorage.getItem('slitherBest') || 0);
  document.getElementById('hudBest').textContent = best;

  function reset(){
    snake = [{x:8,y:9},{x:7,y:9},{x:6,y:9}];
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    score = 0;
    tickMs = 130;
    placeFood();
    playing = true;
  }

  function placeFood(){
    let ok = false, fx, fy;
    while (!ok){
      fx = Math.floor(Math.random()*GRID);
      fy = Math.floor(Math.random()*GRID);
      ok = !snake.some(s => s.x===fx && s.y===fy);
    }
    food = {x:fx, y:fy};
  }

  function setDir(nx, ny){
    if (nx === -dir.x && ny === -dir.y) return; // no reversing
    nextDir = {x:nx, y:ny};
  }

  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'w'){ e.preventDefault(); setDir(0,-1); }
    else if (e.key === 'ArrowDown' || e.key === 's'){ e.preventDefault(); setDir(0,1); }
    else if (e.key === 'ArrowLeft' || e.key === 'a'){ e.preventDefault(); setDir(-1,0); }
    else if (e.key === 'ArrowRight' || e.key === 'd'){ e.preventDefault(); setDir(1,0); }
  });

  dpad.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = btn.dataset.dir;
      if (d==='up') setDir(0,-1);
      else if (d==='down') setDir(0,1);
      else if (d==='left') setDir(-1,0);
      else if (d==='right') setDir(1,0);
    });
  });

  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, {passive:true});
  canvas.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy)){
      setDir(dx > 0 ? 1 : -1, 0);
    } else {
      setDir(0, dy > 0 ? 1 : -1);
    }
    touchStart = null;
  }, {passive:true});

  function tick(){
    if (!playing) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID || snake.some(s => s.x===head.x && s.y===head.y)){
      gameOver();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y){
      score += 1;
      document.getElementById('hudScore').textContent = score;
      tickMs = Math.max(65, tickMs - 2.5);
      placeFood();
    } else {
      snake.pop();
    }

    draw();
    tickTimer = setTimeout(tick, tickMs);
  }

  function gameOver(){
    playing = false;
    clearTimeout(tickTimer);
    if (score > best){
      best = score;
      localStorage.setItem('slitherBest', String(best));
      document.getElementById('hudBest').textContent = best;
    }
    document.getElementById('finalScore').textContent = score;
    setTimeout(() => { document.getElementById('overScreen').style.display = 'flex'; }, 200);
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    const grad = ctx.createLinearGradient(0,0,W,H);
    grad.addColorStop(0, '#140a2e');
    grad.addColorStop(1, '#08040f');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    ctx.strokeStyle = 'rgba(139,92,246,0.08)';
    for (let i=0;i<=GRID;i++){
      ctx.beginPath(); ctx.moveTo(i*cell,0); ctx.lineTo(i*cell,H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*cell); ctx.lineTo(W,i*cell); ctx.stroke();
    }

    // food
    ctx.beginPath();
    ctx.arc(food.x*cell+cell/2, food.y*cell+cell/2, cell*0.32, 0, Math.PI*2);
    ctx.fillStyle = '#ff5959';
    ctx.fill();

    // snake
    snake.forEach((s,i) => {
      const t = i / snake.length;
      ctx.fillStyle = i===0 ? '#f0eaff' : `rgba(${124+t*76|0}, ${58+t*100|0}, 237, 1)`;
      const pad = 1.5;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(s.x*cell+pad, s.y*cell+pad, cell-pad*2, cell-pad*2, 4) : ctx.rect(s.x*cell+pad, s.y*cell+pad, cell-pad*2, cell-pad*2);
      ctx.fill();
    });
  }

  function startGame(){
    reset();
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('overScreen').style.display = 'none';
    document.getElementById('hudScore').textContent = '0';
    draw();
    clearTimeout(tickTimer);
    tickTimer = setTimeout(tick, tickMs);
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);

  draw();
})();
</script>

</body>
</html>
