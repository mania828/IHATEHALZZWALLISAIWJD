<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0418">
<title>Merge — HALZZWALL</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Fraunces:ital@1&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0a0418; --ink:#f0eaff; --dim:#9d8fc9; --violet:#a78bfa; }
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
  html,body{height:100%;background:var(--bg);overflow:hidden}
  body{ color:var(--ink); font-family:'Sora',sans-serif; display:flex; flex-direction:column; align-items:center; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }
  .top{ width:100%; max-width:900px; display:flex; align-items:center; justify-content:space-between; padding:16px 18px 8px; }
  .back{ font-size:12.5px; color:var(--dim); } .back:hover{ color:var(--ink); }
  .title{ font-family:'Fraunces',serif; font-style:italic; font-size:14px; color:var(--violet); }
  .hud{ width:100%; max-width:900px; display:flex; justify-content:space-between; padding:4px 18px 14px; }
  .hud .lbl{ color:var(--dim); font-weight:500; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; }
  .hud .val{ color:var(--ink); font-size:19px; font-weight:700; }
  #boardWrap{ width:100%; max-width:900px; padding:0 18px 20px; flex:1; display:flex; align-items:center; justify-content:center; }
  #board{
    position:relative; width:100%; max-width:560px; aspect-ratio:1/1;
    background:rgba(20,16,52,.5); border:1px solid rgba(190,150,255,.18); border-radius:16px; padding:8px;
    touch-action:none;
  }
  .cellbg{ position:absolute; background:rgba(255,255,255,0.04); border-radius:8px; }
  .tile{
    position:absolute; display:flex; align-items:center; justify-content:center;
    border-radius:8px; font-weight:800; transition:left .1s ease, top .1s ease;
  }
  #startScreen, #overScreen{
    position:fixed; inset:0; z-index:20; background:rgba(10,4,24,.88); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  #overScreen{ display:none; }
  .card{
    max-width:340px; width:100%; text-align:center;
    background:linear-gradient(165deg,rgba(20,16,52,.7),rgba(8,5,26,.8));
    border:1px solid rgba(190,150,255,.2); border-radius:20px; padding:32px 26px;
  }
  .card h1{
    font-weight:800; font-size:26px;
    background:linear-gradient(160deg,#f6f0ff 20%,#cfaaff 55%,#8b5cf6 95%);
    -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:10px;
  }
  .card p{ font-size:13.5px; color:var(--dim); line-height:1.6; margin-bottom:22px; }
  .bigstat{ font-family:'Fraunces',serif; font-style:italic; font-size:15px; margin-bottom:4px; }
  .playbtn{
    display:inline-flex; align-items:center; gap:8px; padding:14px 30px; border-radius:100px;
    background:linear-gradient(160deg,#c084fc,#7c3aed); border:none; color:#0a0418; font-weight:700; font-size:14px;
    box-shadow:0 10px 30px -8px rgba(160,110,255,.6);
  }
</style>
</head>
<body>

<div class="top"><a href="/math/" class="back">&larr; games</a><span class="title">merge</span></div>
<div class="hud">
  <div><div class="lbl">Score</div><div class="val" id="hudScore">0</div></div>
  <div><div class="lbl">Best</div><div class="val" id="hudBest">0</div></div>
</div>
<div id="boardWrap"><div id="board"></div></div>

<div id="startScreen">
  <div class="card">
    <h1>Merge</h1>
    <p>Swipe or use arrow keys. Matching numbers combine into their sum. Reach 2048 — or just chase a high score.</p>
    <button class="playbtn" id="startBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="#0a0418"><path d="M8 5v14l11-7z"/></svg>Play</button>
  </div>
</div>
<div id="overScreen">
  <div class="card">
    <h1>No moves left</h1>
    <div class="bigstat" id="finalScore">0</div>
    <p>Board's full and nothing else merges.</p>
    <button class="playbtn" id="retryBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="#0a0418"><path d="M8 5v14l11-7z"/></svg>Try again</button>
  </div>
</div>

<script>
(function(){
  const SIZE = 4;
  const board = document.getElementById('board');
  let grid, score, best, playing;
  best = Number(localStorage.getItem('mergeBest')||0);
  document.getElementById('hudBest').textContent = best;

  const COLORS = {
    2:['#2a2140','#f0eaff'], 4:['#352a52','#f0eaff'], 8:['#7c3aed','#fff'],
    16:['#8b5cf6','#fff'], 32:['#a78bfa','#fff'], 64:['#c084fc','#fff'],
    128:['#3ec6ff','#0a0418'], 256:['#34d399','#0a0418'], 512:['#ffd166','#0a0418'],
    1024:['#ff9d5c','#0a0418'], 2048:['#ff5959','#fff']
  };

  function emptyGrid(){ return Array.from({length:SIZE},()=>Array(SIZE).fill(0)); }

  function addRandomTile(){
    const empties = [];
    for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++) if (grid[r][c]===0) empties.push([r,c]);
    if (!empties.length) return;
    const [r,c] = empties[Math.floor(Math.random()*empties.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function reset(){
    grid = emptyGrid();
    score = 0;
    addRandomTile(); addRandomTile();
    playing = true;
    render();
  }

  function cellSize(){
    const rect = board.getBoundingClientRect();
    return (rect.width - 16) / SIZE;
  }

  function render(){
    board.innerHTML = '';
    const cs = cellSize();
    for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++){
      const bg = document.createElement('div');
      bg.className = 'cellbg';
      bg.style.width = cs-8+'px'; bg.style.height = cs-8+'px';
      bg.style.left = (8+c*cs+4)+'px'; bg.style.top = (8+r*cs+4)+'px';
      board.appendChild(bg);
    }
    for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++){
      const v = grid[r][c];
      if (!v) continue;
      const [bgc, fgc] = COLORS[v] || ['#ff5959','#fff'];
      const t = document.createElement('div');
      t.className = 'tile';
      t.style.width = cs-8+'px'; t.style.height = cs-8+'px';
      t.style.left = (8+c*cs+4)+'px'; t.style.top = (8+r*cs+4)+'px';
      t.style.background = bgc; t.style.color = fgc;
      t.style.fontSize = (v>512 ? cs*0.28 : cs*0.36)+'px';
      t.textContent = v;
      board.appendChild(t);
    }
    document.getElementById('hudScore').textContent = score;
  }

  function slideLine(line){
    let vals = line.filter(v=>v!==0);
    for (let i=0;i<vals.length-1;i++){
      if (vals[i] === vals[i+1]){
        vals[i]*=2; score += vals[i];
        vals.splice(i+1,1);
      }
    }
    while (vals.length < SIZE) vals.push(0);
    return vals;
  }

  function move(dir){
    if (!playing) return;
    let g = grid.map(row=>row.slice());
    const before = JSON.stringify(g);

    if (dir === 'left'){
      for (let r=0;r<SIZE;r++) g[r] = slideLine(g[r]);
    } else if (dir === 'right'){
      for (let r=0;r<SIZE;r++) g[r] = slideLine(g[r].slice().reverse()).reverse();
    } else if (dir === 'up'){
      for (let c=0;c<SIZE;c++){
        const col = g.map(row=>row[c]);
        const moved = slideLine(col);
        for (let r=0;r<SIZE;r++) g[r][c] = moved[r];
      }
    } else if (dir === 'down'){
      for (let c=0;c<SIZE;c++){
        const col = g.map(row=>row[c]).reverse();
        const moved = slideLine(col).reverse();
        for (let r=0;r<SIZE;r++) g[r][c] = moved[r];
      }
    }

    const moved = JSON.stringify(g) !== before;
    if (moved){
      grid = g;
      addRandomTile();
      render();
      if (score > best){ best = score; localStorage.setItem('mergeBest', String(best)); document.getElementById('hudBest').textContent = best; }
      if (!hasMoves()) endGame();
    }
  }

  function hasMoves(){
    for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++){
      if (grid[r][c]===0) return true;
      if (c<SIZE-1 && grid[r][c]===grid[r][c+1]) return true;
      if (r<SIZE-1 && grid[r][c]===grid[r+1][c]) return true;
    }
    return false;
  }

  function endGame(){
    playing = false;
    document.getElementById('finalScore').textContent = score;
    setTimeout(()=>{ document.getElementById('overScreen').style.display='flex'; }, 300);
  }

  addEventListener('keydown', (e) => {
    const map = {ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
    if (map[e.key]){ e.preventDefault(); move(map[e.key]); }
  });

  let ts = null;
  board.addEventListener('touchstart', (e)=>{ ts = {x:e.touches[0].clientX, y:e.touches[0].clientY}; }, {passive:true});
  board.addEventListener('touchend', (e)=>{
    if (!ts) return;
    const dx = e.changedTouches[0].clientX - ts.x, dy = e.changedTouches[0].clientY - ts.y;
    if (Math.max(Math.abs(dx),Math.abs(dy)) > 20){
      if (Math.abs(dx) > Math.abs(dy)) move(dx>0?'right':'left');
      else move(dy>0?'down':'up');
    }
    ts = null;
  }, {passive:true});

  function startGame(){
    reset();
    document.getElementById('startScreen').style.display='none';
    document.getElementById('overScreen').style.display='none';
  }
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);
  addEventListener('resize', render);
  grid = emptyGrid(); render();
})();
</script>
</body>
</html>
