<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0418">
<title>Recall — HALZZWALL</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Fraunces:ital@1&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0a0418; --ink:#f0eaff; --dim:#9d8fc9; --violet:#a78bfa; }
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
  html,body{height:100%;background:var(--bg);overflow:hidden}
  body{ color:var(--ink); font-family:'Sora',sans-serif; display:flex; flex-direction:column; align-items:center; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }
  .top{ width:100%; max-width:900px; display:flex; align-items:center; justify-content:space-between; padding:16px 18px 8px; }
  .back{ font-size:12.5px; color:var(--dim); } .back:hover{ color:var(--ink); }
  .title{ font-family:'Fraunces',serif; font-style:italic; font-size:14px; color:var(--violet); }
  .hud{ width:100%; max-width:900px; display:flex; justify-content:space-between; padding:4px 18px 14px; }
  .hud .lbl{ color:var(--dim); font-weight:500; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; }
  .hud .val{ color:var(--ink); font-size:19px; font-weight:700; }
  #boardWrap{ width:100%; max-width:900px; padding:0 18px 20px; flex:1; display:flex; align-items:center; justify-content:center; }
  #board{
    width:100%; max-width:520px; display:grid; grid-template-columns:repeat(4, 1fr); gap:10px;
  }
  .card{
    aspect-ratio:1/1; border-radius:10px; position:relative; cursor:pointer;
    perspective:600px;
  }
  .card-inner{
    position:absolute; inset:0; transition:transform .35s ease; transform-style:preserve-3d;
  }
  .card.flipped .card-inner, .card.matched .card-inner{ transform:rotateY(180deg); }
  .face{
    position:absolute; inset:0; border-radius:10px; display:flex; align-items:center; justify-content:center;
    backface-visibility:hidden; font-size:26px;
  }
  .face.back{ background:rgba(20,16,52,.6); border:1px solid rgba(190,150,255,.2); }
  .face.back::after{ content:'?'; color:var(--dim); font-weight:800; font-size:20px; }
  .face.front{ transform:rotateY(180deg); background:linear-gradient(160deg,#7c3aed,#c084fc); }
  .card.matched .face.front{ opacity:0.55; }
  #startScreen, #overScreen{
    position:fixed; inset:0; z-index:20; background:rgba(10,4,24,.88); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  #overScreen{ display:none; }
  .card2{
    max-width:340px; width:100%; text-align:center;
    background:linear-gradient(165deg,rgba(20,16,52,.7),rgba(8,5,26,.8));
    border:1px solid rgba(190,150,255,.2); border-radius:20px; padding:32px 26px;
  }
  .card2 h1{
    font-weight:800; font-size:26px;
    background:linear-gradient(160deg,#f6f0ff 20%,#cfaaff 55%,#8b5cf6 95%);
    -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:10px;
  }
  .card2 p{ font-size:13.5px; color:var(--dim); line-height:1.6; margin-bottom:22px; }
  .bigstat{ font-family:'Fraunces',serif; font-style:italic; font-size:15px; margin-bottom:4px; }
  .playbtn{
    display:inline-flex; align-items:center; gap:8px; padding:14px 30px; border-radius:100px;
    background:linear-gradient(160deg,#c084fc,#7c3aed); border:none; color:#0a0418; font-weight:700; font-size:14px;
    box-shadow:0 10px 30px -8px rgba(160,110,255,.6);
  }
</style>
</head>
<body>

<div class="top"><a href="/math/" class="back">&larr; games</a><span class="title">recall</span></div>
<div class="hud">
  <div><div class="lbl">Moves</div><div class="val" id="hudMoves">0</div></div>
  <div><div class="lbl">Best</div><div class="val" id="hudBest">—</div></div>
</div>
<div id="boardWrap"><div id="board"></div></div>

<div id="startScreen">
  <div class="card2">
    <h1>Recall</h1>
    <p>Flip two cards at a time. Find every matching pair in as few moves as possible.</p>
    <button class="playbtn" id="startBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="#0a0418"><path d="M8 5v14l11-7z"/></svg>Play</button>
  </div>
</div>
<div id="overScreen">
  <div class="card2">
    <h1>Cleared!</h1>
    <div class="bigstat" id="finalMoves">0 moves</div>
    <p>Every pair found.</p>
    <button class="playbtn" id="retryBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="#0a0418"><path d="M8 5v14l11-7z"/></svg>Play again</button>
  </div>
</div>

<script>
(function(){
  const SYMS = ['✦','◆','●','▲','■','◉','✚','☾'];
  const board = document.getElementById('board');
  let cards, first, second, lock, moves, matched, best;

  best = Number(localStorage.getItem('recallBest')||0);
  document.getElementById('hudBest').textContent = best || '—';

  function shuffle(arr){
    for (let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  function reset(){
    const pairs = shuffle([...SYMS, ...SYMS]);
    cards = pairs.map((sym,i) => ({ id:i, sym, flipped:false, matchedFlag:false }));
    first = null; second = null; lock = false; moves = 0; matched = 0;
    render();
    document.getElementById('hudMoves').textContent = '0';
  }

  function render(){
    board.innerHTML = '';
    cards.forEach(c => {
      const el = document.createElement('div');
      el.className = 'card' + (c.flipped?' flipped':'') + (c.matchedFlag?' matched':'');
      el.innerHTML = `<div class="card-inner">
        <div class="face back"></div>
        <div class="face front">${c.sym}</div>
      </div>`;
      el.addEventListener('click', () => flipCard(c.id));
      board.appendChild(el);
    });
  }

  function flipCard(id){
    if (lock) return;
    const c = cards.find(x=>x.id===id);
    if (!c || c.flipped || c.matchedFlag) return;

    c.flipped = true;
    render();

    if (!first){ first = c; return; }
    second = c;
    moves += 1;
    document.getElementById('hudMoves').textContent = moves;
    lock = true;

    if (first.sym === second.sym){
      first.matchedFlag = true; second.matchedFlag = true;
      matched += 1;
      first = null; second = null; lock = false;
      render();
      if (matched === SYMS.length) endGame();
    } else {
      setTimeout(() => {
        first.flipped = false; second.flipped = false;
        first = null; second = null; lock = false;
        render();
      }, 700);
    }
  }

  function endGame(){
    if (!best || moves < best){
      best = moves;
      localStorage.setItem('recallBest', String(best));
      document.getElementById('hudBest').textContent = best;
    }
    document.getElementById('finalMoves').textContent = moves + ' moves';
    setTimeout(()=>{ document.getElementById('overScreen').style.display='flex'; }, 400);
  }

  function startGame(){
    reset();
    document.getElementById('startScreen').style.display='none';
    document.getElementById('overScreen').style.display='none';
  }
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);
  reset();
})();
</script>
</body>
</html>
