<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0418">
<title>Bonk — HALZZWALL</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Fraunces:ital@1&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0a0418; --ink:#f0eaff; --dim:#9d8fc9; --violet:#a78bfa; }
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
  html,body{height:100%;background:var(--bg);overflow:hidden}
  body{ color:var(--ink); font-family:'Sora',sans-serif; display:flex; flex-direction:column; align-items:center; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }
  .top{ width:100%; max-width:900px; display:flex; align-items:center; justify-content:space-between; padding:16px 18px 8px; }
  .back{ font-size:12.5px; color:var(--dim); } .back:hover{ color:var(--ink); }
  .title{ font-family:'Fraunces',serif; font-style:italic; font-size:14px; color:var(--violet); }
  .hud{ width:100%; max-width:900px; display:flex; justify-content:space-between; padding:4px 18px 14px; }
  .hud .lbl{ color:var(--dim); font-weight:500; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; }
  .hud .val{ color:var(--ink); font-size:19px; font-weight:700; }
  #boardWrap{ width:100%; max-width:900px; padding:0 18px 20px; flex:1; display:flex; align-items:center; justify-content:center; }
  #board{
    width:100%; max-width:520px; display:grid; grid-template-columns:repeat(3,1fr); gap:14px;
  }
  .hole{
    aspect-ratio:1/1; border-radius:50%; position:relative; overflow:hidden;
    background:radial-gradient(ellipse at 50% 60%, #1c1030 0%, #0a0418 70%);
    border:2px solid rgba(190,150,255,.18);
    cursor:pointer;
  }
  .mole{
    position:absolute; left:10%; right:10%; bottom:-100%; height:80%;
    border-radius:50% 50% 46% 46%;
    background:linear-gradient(160deg,#c084fc,#7c3aed);
    transition:bottom .16s cubic-bezier(.34,1.56,.64,1);
    display:flex; align-items:flex-start; justify-content:center; padding-top:14%;
  }
  .hole.up .mole{ bottom:6%; }
  .mole .eyes{ display:flex; gap:14%; }
  .mole .eyes span{ width:12%; aspect-ratio:1/1; background:#171226; border-radius:50%; }
  .hole.bonked .mole{ background:linear-gradient(160deg,#ff9d5c,#ff5959); }
  #startScreen, #overScreen{
    position:fixed; inset:0; z-index:20; background:rgba(10,4,24,.88); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  #overScreen{ display:none; }
  .card{
    max-width:340px; width:100%; text-align:center;
    background:linear-gradient(165deg,rgba(20,16,52,.7),rgba(8,5,26,.8));
    border:1px solid rgba(190,150,255,.2); border-radius:20px; padding:32px 26px;
  }
  .card h1{
    font-weight:800; font-size:26px;
    background:linear-gradient(160deg,#f6f0ff 20%,#cfaaff 55%,#8b5cf6 95%);
    -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:10px;
  }
  .card p{ font-size:13.5px; color:var(--dim); line-height:1.6; margin-bottom:22px; }
  .bigstat{ font-family:'Fraunces',serif; font-style:italic; font-size:15px; margin-bottom:4px; }
  .playbtn{
    display:inline-flex; align-items:center; gap:8px; padding:14px 30px; border-radius:100px;
    background:linear-gradient(160deg,#c084fc,#7c3aed); border:none; color:#0a0418; font-weight:700; font-size:14px;
    box-shadow:0 10px 30px -8px rgba(160,110,255,.6);
  }
</style>
</head>
<body>

<div class="top"><a href="/math/" class="back">&larr; games</a><span class="title">bonk</span></div>
<div class="hud">
  <div><div class="lbl">Score</div><div class="val" id="hudScore">0</div></div>
  <div><div class="lbl">Time</div><div class="val" id="hudTime">30</div></div>
  <div><div class="lbl">Best</div><div class="val" id="hudBest">0</div></div>
</div>
<div id="boardWrap"><div id="board"></div></div>

<div id="startScreen">
  <div class="card">
    <h1>Bonk</h1>
    <p>30 seconds. Click or tap the moles the second they pop up before they duck back down.</p>
    <button class="playbtn" id="startBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="#0a0418"><path d="M8 5v14l11-7z"/></svg>Play</button>
  </div>
</div>
<div id="overScreen">
  <div class="card">
    <h1>Time's up</h1>
    <div class="bigstat" id="finalScore">0</div>
    <p>Nice reflexes.</p>
    <button class="playbtn" id="retryBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="#0a0418"><path d="M8 5v14l11-7z"/></svg>Try again</button>
  </div>
</div>

<script>
(function(){
  const board = document.getElementById('board');
  const HOLES = 9;
  let holeEls = [];
  let score, timeLeft, playing, best, activeHole, popTimer, tickTimer;
  best = Number(localStorage.getItem('bonkBest')||0);
  document.getElementById('hudBest').textContent = best;

  for (let i=0;i<HOLES;i++){
    const h = document.createElement('div');
    h.className = 'hole';
    h.innerHTML = `<div class="mole"><div class="eyes"><span></span><span></span></div></div>`;
    h.addEventListener('click', () => whack(i));
    board.appendChild(h);
    holeEls.push(h);
  }

  function reset(){
    score = 0; timeLeft = 30; playing = true; activeHole = -1;
    document.getElementById('hudScore').textContent = 0;
    document.getElementById('hudTime').textContent = 30;
    holeEls.forEach(h => h.classList.remove('up','bonked'));
    scheduleNextPop();
    clearInterval(tickTimer);
    tickTimer = setInterval(() => {
      timeLeft -= 1;
      document.getElementById('hudTime').textContent = timeLeft;
      if (timeLeft <= 0) endGame();
    }, 1000);
  }

  function scheduleNextPop(){
    clearTimeout(popTimer);
    const delay = 350 + Math.random()*450;
    popTimer = setTimeout(popMole, delay);
  }

  function popMole(){
    if (!playing) return;
    if (activeHole >= 0) holeEls[activeHole].classList.remove('up','bonked');
    let next;
    do { next = Math.floor(Math.random()*HOLES); } while (next === activeHole && HOLES>1);
    activeHole = next;
    holeEls[activeHole].classList.add('up');

    const upTime = Math.max(500, 950 - score*12);
    popTimer = setTimeout(() => {
      if (activeHole >= 0) holeEls[activeHole].classList.remove('up');
      activeHole = -1;
      scheduleNextPop();
    }, upTime);
  }

  function whack(i){
    if (!playing || i !== activeHole) return;
    score += 1;
    document.getElementById('hudScore').textContent = score;
    holeEls[i].classList.add('bonked');
    setTimeout(() => holeEls[i].classList.remove('bonked','up'), 150);
    clearTimeout(popTimer);
    activeHole = -1;
    scheduleNextPop();
  }

  function endGame(){
    playing = false;
    clearInterval(tickTimer);
    clearTimeout(popTimer);
    holeEls.forEach(h => h.classList.remove('up'));
    if (score > best){ best = score; localStorage.setItem('bonkBest', String(best)); document.getElementById('hudBest').textContent = best; }
    document.getElementById('finalScore').textContent = score;
    setTimeout(()=>{ document.getElementById('overScreen').style.display='flex'; }, 300);
  }

  function startGame(){
    reset();
    document.getElementById('startScreen').style.display='none';
    document.getElementById('overScreen').style.display='none';
  }
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);
})();
</script>
</body>
</html>
