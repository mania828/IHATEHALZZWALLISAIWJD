<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0418">
<title>Music — HALZZ WALL</title>
<meta name="description" content="Listen to everything.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Fraunces:ital@1&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f0eaff; --dim:#9d8fc9; --cyan:#c9a2ff; --violet:#a78bfa; --bg:#0a0418;
  }
  *{margin:0;padding:0;box-sizing:border-box;
    user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;
  }
  html,body{height:100%;background:var(--bg)}
  body{
    color:var(--ink); font-family:'Sora',sans-serif;
    background-image:
      radial-gradient(ellipse 60% 45% at 50% 0%, rgba(139,92,246,0.20), transparent 60%),
      radial-gradient(ellipse 50% 40% at 90% 100%, rgba(124,58,237,0.14), transparent 60%);
    min-height:100vh; padding:28px 20px 60px;
  }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }

  .top{ display:flex; align-items:center; justify-content:space-between; max-width:640px; margin:0 auto 34px; }
  .back{ font-size:13px; color:var(--dim); display:inline-flex; align-items:center; gap:6px; }
  .back:hover{ color:var(--ink); }
  .wordmark{ font-family:'Fraunces',serif; font-style:italic; font-size:15px; color:var(--cyan); }

  .hero{ text-align:center; max-width:640px; margin:0 auto 40px; }
  .hero h1{
    font-family:'Sora',sans-serif; font-weight:800; font-size:clamp(30px,6vw,46px); letter-spacing:-0.01em;
    background:linear-gradient(160deg,#f6f0ff 20%,#cfaaff 55%,#8b5cf6 95%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero p{ margin-top:10px; font-size:14px; color:var(--dim); }

  .tracklist{ max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:10px; }

  .track{
    display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:14px;
    background:linear-gradient(165deg,rgba(20,16,52,.5),rgba(8,5,26,.6));
    border:1px solid rgba(190,150,255,.18);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    transition:border-color .2s ease, transform .2s ease;
  }
  .track:hover{ border-color:rgba(196,162,255,.4); transform:translateY(-1px); }
  .track.playing{ border-color:var(--violet); box-shadow:0 8px 24px -10px rgba(139,92,246,.5); }

  .track-num{ font-family:'Fraunces',serif; font-style:italic; font-size:16px; color:var(--dim); width:22px; flex:0 0 auto; text-align:center; }

  .track-play{
    width:38px; height:38px; border-radius:50%; flex:0 0 auto; border:none;
    background:linear-gradient(160deg,#c084fc,#7c3aed);
    display:flex; align-items:center; justify-content:center;
    transition:transform .15s ease;
  }
  .track-play:hover{ transform:scale(1.06); }
  .track-play svg{ width:14px; height:14px; fill:#0a0418; margin-left:1px; }
  .track.playing .track-play svg{ margin-left:0; }

  .track-info{ flex:1; min-width:0; }
  .track-title{ font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track-artist{ font-size:11.5px; color:var(--dim); margin-top:2px; }

  .track-time{ font-family:'Fraunces',serif; font-size:12px; color:var(--dim); flex:0 0 auto; }

  .now-playing-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    background:rgba(10,4,24,.85); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-top:1px solid rgba(190,150,255,.2);
    padding:12px 20px calc(12px + env(safe-area-inset-bottom));
    display:none;
  }
  .now-playing-bar.show{ display:block; }
  .npb-inner{ max-width:640px; margin:0 auto; }
  .npb-top{ display:flex; align-items:center; gap:12px; margin-bottom:8px; }
  .npb-title{ font-size:13px; font-weight:600; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .npb-times{ font-family:'Fraunces',serif; font-size:11px; color:var(--dim); }
  #npbBar{ position:relative; height:5px; border-radius:100px; background:rgba(190,150,255,.15); cursor:pointer; overflow:hidden; }
  #npbFill{ position:absolute; top:0; left:0; height:100%; width:0%; background:linear-gradient(90deg,#8b5cf6,#c084fc); border-radius:100px; }
  .npb-vol{ display:flex; align-items:center; gap:8px; margin-top:8px; }
  #npbVol{ -webkit-appearance:none; appearance:none; width:90px; height:4px; border-radius:100px; background:rgba(190,150,255,.15); outline:none; cursor:pointer; }
  #npbVol::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:12px; height:12px; border-radius:50%; background:linear-gradient(160deg,#c084fc,#7c3aed); cursor:pointer; }
  #npbVol::-moz-range-thumb{ width:12px; height:12px; border-radius:50%; border:none; background:linear-gradient(160deg,#c084fc,#7c3aed); cursor:pointer; }
  .npb-vol svg{ width:15px; height:15px; fill:var(--dim); flex:0 0 auto; }

  :focus-visible{ outline:2px solid var(--violet); outline-offset:2px; }
</style>
</head>
<body>

<div class="top">
  <a href="/" class="back">&larr; halzz wall</a>
  <span class="wordmark">music</span>
</div>

<div class="hero">
  <h1>my playlist</h1>
  <p>Tap a track to play. More gets added here whenever there's more.</p>
</div>

<div class="tracklist" id="tracklist"></div>

<div class="now-playing-bar" id="npb">
  <div class="npb-inner">
    <div class="npb-top">
      <button class="track-play" id="npbPlayBtn" style="width:32px;height:32px">
        <svg id="npbPlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <span class="npb-title" id="npbTitle"></span>
      <span class="npb-times"><span id="npbCur">0:00</span> / <span id="npbDur">0:00</span></span>
    </div>
    <div id="npbBar"><div id="npbFill"></div></div>
    <div class="npb-vol">
      <svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3z"/></svg>
      <input type="range" id="npbVol" min="0" max="100" value="70">
    </div>
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script>
  // ==========================================================================
  // Track list — add more songs here as you have them. Each entry needs a
  // title, artist, and the path to the mp3 (relative to this page).
  // ==========================================================================
  const TRACKS = [
    { title: "misery", artist: "halzz", src: "../mis/Halzz-misery.mp3" },
    // { title: "next one", artist: "halzz", src: "../mis/next-song.mp3" },
  ];

  const audio = document.getElementById('audio');
  const listEl = document.getElementById('tracklist');
  const npb = document.getElementById('npb');
  const npbPlayBtn = document.getElementById('npbPlayBtn');
  const npbPlayIcon = document.getElementById('npbPlayIcon');
  const npbTitle = document.getElementById('npbTitle');
  const npbBar = document.getElementById('npbBar');
  const npbFill = document.getElementById('npbFill');
  const npbCur = document.getElementById('npbCur');
  const npbDur = document.getElementById('npbDur');
  const npbVol = document.getElementById('npbVol');

  let currentIndex = -1;
  audio.volume = npbVol.value / 100;

  function fmt(s){
    if (!isFinite(s)) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60).toString().padStart(2, '0');
    return m + ':' + sec;
  }

  function renderList(){
    listEl.innerHTML = TRACKS.map((t, i) => `
      <div class="track" data-index="${i}" id="track-${i}">
        <span class="track-num">${String(i + 1).padStart(2, '0')}</span>
        <button class="track-play" data-play="${i}">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="track-info">
          <div class="track-title">${escapeHtml(t.title)}</div>
          <div class="track-artist">${escapeHtml(t.artist)}</div>
        </div>
        <span class="track-time" data-time="${i}">--:--</span>
      </div>
    `).join('');

    listEl.querySelectorAll('[data-play]').forEach(btn => {
      btn.addEventListener('click', () => playTrack(Number(btn.dataset.play)));
    });
  }

  function playTrack(index){
    if (index === currentIndex) {
      togglePlayback();
      return;
    }
    currentIndex = index;
    const t = TRACKS[index];
    audio.src = t.src;
    audio.play().catch(() => {});
    npb.classList.add('show');
    npbTitle.textContent = t.title + ' — ' + t.artist;
    updatePlayingUI();
  }

  function togglePlayback(){
    if (audio.paused) audio.play();
    else audio.pause();
  }

  function updatePlayingUI(){
    document.querySelectorAll('.track').forEach(el => el.classList.remove('playing'));
    const isPlaying = !audio.paused;
    const iconPath = isPlaying
      ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
    npbPlayIcon.innerHTML = iconPath;

    if (currentIndex >= 0) {
      const rowIcon = document.querySelector(`[data-play="${currentIndex}"] svg`);
      if (rowIcon) rowIcon.innerHTML = iconPath;
      const row = document.getElementById('track-' + currentIndex);
      if (row && isPlaying) row.classList.add('playing');
    }
  }

  npbPlayBtn.addEventListener('click', togglePlayback);
  audio.addEventListener('play', updatePlayingUI);
  audio.addEventListener('pause', updatePlayingUI);

  audio.addEventListener('loadedmetadata', () => {
    npbDur.textContent = fmt(audio.duration);
    if (currentIndex >= 0) {
      const timeEl = document.querySelector(`[data-time="${currentIndex}"]`);
      if (timeEl) timeEl.textContent = fmt(audio.duration);
    }
  });

  audio.addEventListener('timeupdate', () => {
    npbCur.textContent = fmt(audio.currentTime);
    const pct = (audio.currentTime / audio.duration) * 100 || 0;
    npbFill.style.width = pct + '%';
  });

  audio.addEventListener('ended', () => {
    if (currentIndex < TRACKS.length - 1) playTrack(currentIndex + 1);
    else updatePlayingUI();
  });

  npbBar.addEventListener('click', (e) => {
    const rect = npbBar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    if (isFinite(audio.duration)) audio.currentTime = pct * audio.duration;
  });

  npbVol.addEventListener('input', () => {
    audio.volume = npbVol.value / 100;
  });

  function escapeHtml(s){
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  renderList();
</script>

</body>
</html>
